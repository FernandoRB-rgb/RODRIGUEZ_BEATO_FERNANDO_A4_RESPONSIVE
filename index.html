<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web responsiva</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
 
<div class="cabecera">
    <h1>Una web que se adapta</h1>
</div>
 
<div class="menu">
    <a href="#">Inicio</a>
    <a href="#">Noticias</a>
    <a href="#">Contacto</a>
</div>
 
<div class="contenedor">
    <div class="columna">
        <h2>Texto</h2>
        <p>Este bloque ocupará aproximadamente la mitad de la página en una pantalla grande y todo el ancho en una pantalla pequeña.</p>
    </div>
 
    <div class="columna">
        <h2>Imagen</h2>
        <img src="img/imagen.jpg" alt="Imagen para probar el diseño responsivo">
    </div>
</div>
 
<div class="tarjetas">
    <div class="tarjeta"><h3>Uno</h3><p>Contenido breve.</p></div>
    <div class="tarjeta"><h3>Dos</h3><p>Contenido breve.</p></div>
    <div class="tarjeta"><h3>Tres</h3><p>Contenido breve.</p></div>
</div>
 
</body>
</html>
